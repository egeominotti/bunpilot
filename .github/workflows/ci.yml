name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  quality:
    name: Biome, types, version, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting, lint, imports, and types
        run: |
          bun run check
          bun run typecheck
          bun run version:check
      - name: Audit dependencies
        run: npm audit --audit-level=high

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run complete test suite
        run: bun test --timeout 30000
      - name: Run module simulation
        run: bun run simulate
      - name: Run real cluster simulation
        run: bun run simulate:cluster
      - name: Generate coverage
        if: runner.os == 'Linux'
        run: bun run test:coverage
      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Native binary (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build native executable
        run: bun run build
      - name: Smoke-test executable
        run: |
          expected_version=$(node -p "require('./package.json').version")
          test "$(./bunpilot --version)" = "bunpilot v${expected_version}"
      - uses: actions/upload-artifact@v4
        with:
          name: bunpilot-${{ runner.os }}-${{ runner.arch }}
          path: bunpilot
          if-no-files-found: error
          retention-days: 7
