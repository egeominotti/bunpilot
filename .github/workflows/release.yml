name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify version and quality gates
        run: |
          bun run version:check "${GITHUB_REF_NAME}"
          bun run ci
          bun run simulate
          bun run simulate:cluster

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: bun-linux-x64-baseline
          - platform: linux-x64-musl
            target: bun-linux-x64-musl-baseline
          - platform: linux-arm64
            target: bun-linux-arm64
          - platform: linux-arm64-musl
            target: bun-linux-arm64-musl
          - platform: macos-x64
            target: bun-darwin-x64
          - platform: macos-arm64
            target: bun-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Cross-compile executable
        run: >-
          bun build src/index.ts --compile --minify --sourcemap=none
          --no-compile-autoload-dotenv --no-compile-autoload-bunfig
          --target=${{ matrix.target }} --outfile dist/bunpilot
      - name: Package release archive
        run: |
          mkdir -p package
          cp dist/bunpilot package/bunpilot
          cp README.md LICENSE package/
          tar -czf "bunpilot-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz" -C package .
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: bunpilot-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-assets/*
          --verify-tag --generate-notes --title "Bunpilot ${GITHUB_REF_NAME}"
